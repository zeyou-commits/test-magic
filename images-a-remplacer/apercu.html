<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aperçu des images</title>
<style>
  :root { --encre:#17322a; --doux:#5d716a; --trait:#dde5e1; --vert:#0e7a43; --vert-f:#e2f4ea; --ambre:#8a5a00; --ambre-f:#fdf0d5; --rouge:#b3261e; --rouge-f:#fbe4e2; --sombre:#141c24; }
  * { box-sizing:border-box; }
  body { margin:0; background:#f5f7f6; color:var(--encre); font:15px/1.45 system-ui,"Segoe UI",Arial,sans-serif; }
  header { position:sticky; top:0; z-index:2; background:#fff; border-bottom:1px solid var(--trait); padding:12px 16px; }
  h1 { margin:0; font-size:19px; }
  .compte { color:var(--doux); margin:2px 0 8px; }
  .jauge { height:6px; background:var(--trait); border-radius:3px; overflow:hidden; }
  .jauge i { display:block; height:100%; background:var(--vert); width:0; }
  nav { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
  nav button { font:inherit; border:1px solid var(--trait); background:#fff; color:var(--encre); padding:4px 12px; border-radius:99px; cursor:pointer; }
  nav button[aria-pressed=true] { background:var(--encre); border-color:var(--encre); color:#fff; }
  main { padding:16px; max-width:1200px; margin:auto; }
  #rapport { background:#fff; border:1px solid var(--trait); border-radius:10px; padding:10px 14px; margin-bottom:16px; }
  #rapport:empty { display:none; }
  #rapport h2 { font-size:15px; margin:0 0 4px; }
  #rapport ul { margin:0 0 8px; padding-left:18px; }
  section > h2 { font-size:17px; margin:22px 0 2px; }
  section > p { margin:0 0 10px; color:var(--doux); font-size:13px; }
  .grille { display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:10px; }
  .carte { background:#fff; border:1px solid var(--trait); border-radius:10px; overflow:hidden; }
  .tete { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:8px 10px; }
  .nom { font-weight:600; font-size:13px; overflow-wrap:anywhere; }
  .etat { flex:none; font-size:12px; padding:1px 8px; border-radius:99px; background:var(--ambre-f); color:var(--ambre); }
  .carte[data-etat=remplacee] .etat { background:var(--vert-f); color:var(--vert); }
  .carte[data-etat=casse] .etat { background:var(--rouge-f); color:var(--rouge); }
  .bande { display:flex; align-items:center; gap:10px; min-height:96px; padding:6px 10px; overflow:hidden; }
  .bande img { display:block; flex:none; }
  .clair { background:#fff; border-top:1px solid var(--trait); }
  .sombre { background:var(--sombre); }
  .rond { border-radius:50%; background:#fff3dd; object-fit:cover; }
  .disque { flex:none; display:flex; align-items:center; justify-content:center; border-radius:50%; background:#d9f2e6; overflow:hidden; }
  .disque img { width:92%; height:92%; margin-top:6%; object-fit:contain; }
  .pied { display:flex; gap:8px; align-items:center; padding:6px 10px; border-top:1px solid var(--trait); color:var(--doux); font-size:12px; }
  .pied img { width:32px; height:32px; }
  @media (max-width:420px) { .grille { grid-template-columns:1fr; } }
</style>
</head>
<body>
<header>
  <h1>Images de BledWay</h1>
  <div class="compte" id="compte"></div>
  <div class="jauge"><i id="jauge"></i></div>
  <nav id="filtres"></nav>
</header>
<main>
  <div id="rapport"></div>
  <div id="liste"></div>
</main>
<script src="outil/emplacements.js"></script>
<script src="etat.js"></script>
<script>
  const SECTIONS = {
    avatars: ["Avatars", "Voyageurs sur la carte et dans les panneaux."],
    statuts: ["Statuts", "En route, au port, à bord, arrivé."],
    persos: ["Personnages", "Les avatars que chacun choisit dans son profil."],
    humeurs: ["Humeurs", "Le fil et le choix de l'humeur."],
    pictos: ["Icônes d'humeur", "La petite pastille posée sur l'avatar."],
    reactions: ["Réactions", "Prêtes dans le code, pas encore affichées dans l'app."],
  };
  const etat = window.ETAT || { images: {}, rapport: null };
  const liste = document.getElementById("liste");
  const cree = (tag, classe, texte) => {
    const el = document.createElement(tag);
    if (classe) el.className = classe;
    if (texte) el.textContent = texte;
    return el;
  };
  const cartes = [];

  function libelle(carte) {
    const lieu = carte.dataset.etat;
    carte.querySelector(".etat").textContent = lieu === "remplacee" ? "Remplacée" : lieu === "casse" ? "Image introuvable" : "À remplacer";
  }
  function image(e, src, taille, classe) {
    const img = cree("img", classe);
    img.src = src;
    img.alt = "";
    img.width = taille;
    img.height = taille;
    img.onerror = () => {
      const carte = img.closest(".carte");
      if (carte && carte.dataset.etat !== "casse") {
        carte.dataset.etat = "casse";
        libelle(carte);
        majCompte();
      }
    };
    return img;
  }
  function bande(e, src, fond) {
    const b = cree("div", "bande " + fond);
    for (const taille of e.affichage) {
      if (e.dossier === "avatars") {
        b.append(image(e, src, taille, "rond"));
      } else if (e.dossier === "persos") {
        const d = cree("span", "disque");
        d.style.width = d.style.height = taille + "px";
        d.append(image(e, src, taille));
        b.append(d);
      } else {
        b.append(image(e, src, taille));
      }
    }
    return b;
  }
  for (const [dossier, [titre, texte]] of Object.entries(SECTIONS)) {
    const section = cree("section");
    const items = window.EMPLACEMENTS.filter((e) => e.dossier === dossier);
    section.append(cree("h2", "", `${titre} (${items.length})`), cree("p", "", `${texte} Tailles affichées : ${items[0].affichage.join(", ")} px.`));
    const grille = cree("div", "grille");
    for (const e of items) {
      const info = etat.images[e.nom] || {};
      const src = `../public/cabas/${e.cible}${info.version ? "?v=" + info.version : ""}`;
      const carte = cree("article", "carte");
      carte.dataset.etat = info.manque ? "casse" : info.remplacee ? "remplacee" : "manquante";
      const tete = cree("div", "tete");
      tete.append(cree("span", "nom", e.nom), cree("span", "etat"));
      carte.append(tete, bande(e, src, "clair"), bande(e, src, "sombre"));
      if (info.remplacee && info.sauvegarde) {
        const pied = cree("div", "pied", "Avant :");
        pied.append(image(e, `_sauvegarde-originaux/${e.cible}`, 32));
        carte.append(pied);
      }
      libelle(carte);
      cartes.push(carte);
      grille.append(carte);
    }
    section.append(grille);
    liste.append(section);
  }

  function majCompte() {
    const faites = cartes.filter((c) => c.dataset.etat === "remplacee").length;
    const cassees = cartes.filter((c) => c.dataset.etat === "casse").length;
    document.getElementById("compte").textContent =
      `${faites} remplacées sur ${cartes.length}, ${cartes.length - faites - cassees} à remplacer` +
      (cassees ? `, ${cassees} introuvables` : "") +
      (etat.date ? ` · dernier passage de l'outil : ${etat.date}` : "");
    document.getElementById("jauge").style.width = (faites * 100) / cartes.length + "%";
  }
  majCompte();

  const filtres = document.getElementById("filtres");
  for (const [valeur, nom] of [["", "Toutes"], ["manquante", "À remplacer"], ["remplacee", "Remplacées"]]) {
    const bouton = cree("button", "", nom);
    bouton.setAttribute("aria-pressed", valeur === "");
    bouton.onclick = () => {
      filtres.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", b === bouton));
      for (const c of cartes) c.hidden = Boolean(valeur) && c.dataset.etat !== valeur;
    };
    filtres.append(bouton);
  }

  const r = etat.rapport;
  if (r) {
    const zone = document.getElementById("rapport");
    const bloc = (titre, lignes) => {
      if (!lignes.length) return;
      const ul = cree("ul");
      lignes.forEach((l) => ul.append(cree("li", "", l)));
      zone.append(cree("h2", "", titre), ul);
    };
    bloc("Noms inconnus, fichiers ignorés", r.inconnues.map((i) => `${i.fichier} : ${i.conseil}`));
    bloc("Images refusées, l'ancienne reste en place", r.refusees.map((i) => `${i.fichier} : ${i.raison}`));
    bloc("À regarder", r.alertes.map((i) => `${i.nom} : ${i.message}`));
  }
</script>
</body>
</html>
